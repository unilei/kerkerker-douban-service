name: Refresh Douban data

# 每日定时刷新的「主通道」是部署服务器上的 crontab（见 README）：
#   0 2 * * * docker run --rm --network <douban-network> --env-file /opt/kerkerker-douban-service/douban.env \
#     ghcr.io/unilei/kerkerker-douban-service:latest /app/refresh --max-age=24h --limit=500
# 原因：douban-mongo 仅在 docker 内网可达，GitHub runner 无法直连。
#
# 本 workflow 仅保留手动触发（workflow_dispatch），用于将来 Mongo 可公网访问时
# （或通过 SSH action）从 Actions 侧补数据。需要配置 Secrets：
#   MONGO_URI              - MongoDB 连接串（含账号密码，公网可达）
#   DOUBAN_API_PROXY       - （可选）豆瓣请求代理，逗号分隔
#   CLOUDFLARE_R2_*        - （可选）图片同步凭据
on:
  workflow_dispatch:
    inputs:
      max_age:
        description: "超过该时长未刷新的影片视为陈旧（Go duration，如 24h、12h）"
        required: false
        default: "24h"
      limit:
        description: "单次刷新的最大条目数"
        required: false
        default: "500"
      dry_run:
        description: "仅列出待刷新条目，不实际抓取"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Build refresh binary
        run: go build -o /tmp/refresh ./cmd/refresh

      - name: Validate optional job-report configuration
        env:
          JOB_REPORT_MODE: ${{ vars.DEPLOY_JOB_REPORT_MODE }}
          JOB_REPORT_URL: ${{ secrets.DEPLOY_JOB_REPORT_URL }}
          JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_REPORT_MODE" in
            "") exit 0 ;;
            http|both) ;;
            *)
              echo "DEPLOY_JOB_REPORT_MODE must be empty, http, or both" >&2
              exit 1
              ;;
          esac
          [[ "$JOB_REPORT_URL" =~ ^https://[^[:space:]#]+/api/plugins/jobs/report$ ]] || {
            echo "DEPLOY_JOB_REPORT_URL must be an HTTPS job-report endpoint" >&2
            exit 1
          }
          authority="${JOB_REPORT_URL#https://}"
          authority="${authority%%/*}"
          [[ -n "$authority" && "$authority" != *"@"* ]] || {
            echo "DEPLOY_JOB_REPORT_URL authority is invalid" >&2
            exit 1
          }
          [[ "$JOB_REPORT_TOKEN" =~ ^[A-Za-z0-9._~-]{32,512}$ ]] || {
            echo "DEPLOY_JOB_REPORT_TOKEN must be a 32-512 character base64url-style secret" >&2
            exit 1
          }
          status="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $JOB_REPORT_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' "$JOB_REPORT_URL")"
          [[ "$status" == "400" ]] || {
            echo "Host job-report credential probe returned HTTP $status instead of 400" >&2
            exit 1
          }

      - name: Run refresh
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          DOUBAN_API_PROXY: ${{ secrets.DOUBAN_API_PROXY }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_UPLOAD_API_URL: ${{ secrets.CLOUDFLARE_R2_UPLOAD_API_URL }}
          CLOUDFLARE_R2_UPLOAD_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_UPLOAD_API_TOKEN }}
          CLOUDFLARE_R2_KEY_PREFIX: ${{ secrets.CLOUDFLARE_R2_KEY_PREFIX }}
          KERKERKER_JOB_REPORT: ${{ vars.DEPLOY_JOB_REPORT_MODE }}
          KERKERKER_JOB_REPORT_URL: ${{ secrets.DEPLOY_JOB_REPORT_URL }}
          KERKERKER_JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
          KERKERKER_REFRESH_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          KERKERKER_JOB_ID: content.refresh.daily
          KERKERKER_PLUGIN_ID: kerkerker.douban-content
          KERKERKER_PLUGIN_VERSION: 1.0.0
          KERKERKER_PLUGIN_PROFILE: cn-default
          KERKERKER_PLUGIN_CONFIG_VERSION: runtime
          KERKERKER_JOB_ACTOR: system/github-actions
        run: |
          /tmp/refresh \
            --max-age="${{ github.event.inputs.max_age || '24h' }}" \
            --limit="${{ github.event.inputs.limit || '500' }}" \
            --dry-run="${{ github.event.inputs.dry_run || 'false' }}"
