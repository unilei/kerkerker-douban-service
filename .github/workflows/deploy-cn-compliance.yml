name: Deploy Douban Service (cn-compliance)

on:
  push:
    branches:
      - cn-compliance
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to the commit SHA)"
        required: false
        type: string

concurrency:
  group: kerkerker-douban-cn-compliance-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
  STABLE_IMAGE_NAME: ${{ vars.DEPLOY_STABLE_IMAGE_NAME || 'ghcr.io/unilei/kerkerker-douban-service' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/www/wwwroot/kerkerker-douban-service' }}
  DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE || '/opt/kerkerker-douban-service/douban.env' }}
  SERVICE_PORT: ${{ vars.DEPLOY_PORT || '8081' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout host job-event fixture
        uses: actions/checkout@v4
        with:
          repository: unilei/kerkerker
          ref: cn-compliance
          path: .host-contract
          sparse-checkout: |
            packages/kerkerker-plugin-contract/fixtures/plugin-job-event.v1.valid.json
            packages/kerkerker-plugin-contract/fixtures/plugin-job-event.v1.invalid.json
          sparse-checkout-cone-mode: false

      - name: Verify host and worker job-event fixtures match
        run: |
          cmp \
            internal/jobreport/testdata/plugin-job-event.v1.valid.json \
            .host-contract/packages/kerkerker-plugin-contract/fixtures/plugin-job-event.v1.valid.json
          cmp \
            internal/jobreport/testdata/plugin-job-event.v1.invalid.json \
            .host-contract/packages/kerkerker-plugin-contract/fixtures/plugin-job-event.v1.invalid.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go build ./...

  publish:
    name: Build and publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image tag
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_IMAGE_TAG:-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:cn-compliance-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to existing Docker VPS
    needs: publish
    if: github.repository_owner == 'unilei'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          JOB_REPORT_MODE: ${{ vars.DEPLOY_JOB_REPORT_MODE }}
          JOB_REPORT_URL: ${{ secrets.DEPLOY_JOB_REPORT_URL }}
          JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
          TMDB_PLUGIN_SERVICE_TOKEN: ${{ secrets.DEPLOY_TMDB_PLUGIN_SERVICE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          [[ "$TMDB_PLUGIN_SERVICE_TOKEN" =~ ^[A-Za-z0-9._~-]{32,512}$ ]] || {
            echo "DEPLOY_TMDB_PLUGIN_SERVICE_TOKEN must be a 32-512 character URL-safe secret" >&2
            exit 1
          }
          [[ "$DEPLOY_HOST" != *$'\n'* ]] || { echo "DEPLOY_HOST contains a newline" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo "Invalid DEPLOY_USER" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          [[ "$DEPLOY_ENV_FILE" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "Invalid DEPLOY_ENV_FILE" >&2; exit 1; }
          [[ "$SERVICE_PORT" =~ ^[0-9]+$ ]] && (( SERVICE_PORT >= 1 && SERVICE_PORT <= 65535 )) || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          case "$JOB_REPORT_MODE" in
            "") ;;
            http|both)
              [[ "$JOB_REPORT_URL" =~ ^https://[^[:space:]#]+/api/plugins/jobs/report$ ]] || {
                echo "DEPLOY_JOB_REPORT_URL must be an HTTPS job-report endpoint" >&2
                exit 1
              }
              authority="${JOB_REPORT_URL#https://}"
              authority="${authority%%/*}"
              [[ -n "$authority" && "$authority" != *"@"* ]] || {
                echo "DEPLOY_JOB_REPORT_URL authority is invalid" >&2
                exit 1
              }
              [[ "$JOB_REPORT_TOKEN" =~ ^[A-Za-z0-9._~-]{32,512}$ ]] || {
                echo "DEPLOY_JOB_REPORT_TOKEN must be a 32-512 character base64url-style secret" >&2
                exit 1
              }
              ;;
            *)
              echo "DEPLOY_JOB_REPORT_MODE must be empty, http, or both" >&2
              exit 1
              ;;
          esac

      - name: Verify host job-report credentials
        env:
          JOB_REPORT_MODE: ${{ vars.DEPLOY_JOB_REPORT_MODE }}
          JOB_REPORT_URL: ${{ secrets.DEPLOY_JOB_REPORT_URL }}
          JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$JOB_REPORT_MODE" ]]; then
            echo "Job reporting remains disabled"
            exit 0
          fi
          status="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $JOB_REPORT_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' "$JOB_REPORT_URL")"
          [[ "$status" == "400" ]] || {
            echo "Host job-report credential probe returned HTTP $status instead of 400" >&2
            exit 1
          }

      - name: Prepare SSH
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/douban_deploy_key"
          known_hosts="$RUNNER_TEMP/douban_known_hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          test -s "$known_hosts"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Stage refresh job-report configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          JOB_REPORT_MODE: ${{ vars.DEPLOY_JOB_REPORT_MODE }}
          JOB_REPORT_URL: ${{ secrets.DEPLOY_JOB_REPORT_URL }}
          JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
          TMDB_PLUGIN_SERVICE_TOKEN: ${{ secrets.DEPLOY_TMDB_PLUGIN_SERVICE_TOKEN }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DEPLOY_PATH/.job-report.env.new'"
          report_env="$RUNNER_TEMP/job-report.env"
          umask 077
          trap 'rm -f "$report_env"' EXIT
          if [[ -z "$JOB_REPORT_MODE" ]]; then
            JOB_REPORT_URL=""
            JOB_REPORT_TOKEN=""
          fi
          {
            printf 'KERKERKER_JOB_REPORT=%s\n' "$JOB_REPORT_MODE"
            printf 'KERKERKER_JOB_REPORT_URL=%s\n' "$JOB_REPORT_URL"
            printf 'KERKERKER_JOB_REPORT_TOKEN=%s\n' "$JOB_REPORT_TOKEN"
            printf '%s\n' 'KERKERKER_JOB_ID=content.refresh.daily'
            printf '%s\n' 'KERKERKER_PLUGIN_ID=kerkerker.douban-content'
            printf '%s\n' 'KERKERKER_PLUGIN_VERSION=1.0.0'
            printf '%s\n' 'KERKERKER_PLUGIN_PROFILE=cn-default'
            printf '%s\n' 'KERKERKER_PLUGIN_CONFIG_VERSION=runtime'
            printf '%s\n' 'KERKERKER_JOB_ACTOR=system/refresh'
            printf 'TMDB_PLUGIN_SERVICE_TOKEN=%s\n' "$TMDB_PLUGIN_SERVICE_TOKEN"
          } > "$report_env"
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; umask 077; cat > '$DEPLOY_PATH/.job-report.env.new'; chmod 600 '$DEPLOY_PATH/.job-report.env.new'" \
            < "$report_env"

      - name: Roll out and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_ENV_FILE='$DEPLOY_ENV_FILE' SERVICE_PORT='$SERVICE_PORT' IMAGE_NAME='$IMAGE_NAME' STABLE_IMAGE_NAME='$STABLE_IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          compose_file=""
          for candidate in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [ -f "$candidate" ]; then
              compose_file="$candidate"
              break
            fi
          done
          [ -n "$compose_file" ] || { echo "No Compose file found in $DEPLOY_PATH" >&2; exit 1; }
          [ -f "$DEPLOY_ENV_FILE" ] || { echo "Server deployment environment file is missing" >&2; exit 1; }

          # Production started with a legacy Compose file that does not declare
          # the persistence and image-mirroring variables. Keep the dedicated
          # server env file as the source of truth and layer it over either the
          # legacy file or the current repository Compose file.
          umask 077
          override_file="$(mktemp "$DEPLOY_PATH/.deploy-cn-compliance.XXXXXX.yml")"
          cat > "$override_file" <<'OVERRIDE'
          services:
            douban-api:
              env_file:
                - "${DEPLOY_ENV_FILE}"
              environment:
                MONGO_URI: "${MONGO_URI:-}"
                MONGO_DB_NAME: "${MONGO_DB_NAME:-kerkerker_douban}"
                CLOUDFLARE_R2_ACCOUNT_ID: "${CLOUDFLARE_R2_ACCOUNT_ID:-}"
                CLOUDFLARE_R2_ENDPOINT: "${CLOUDFLARE_R2_ENDPOINT:-}"
                CLOUDFLARE_R2_ACCESS_KEY_ID: "${CLOUDFLARE_R2_ACCESS_KEY_ID:-}"
                CLOUDFLARE_R2_SECRET_ACCESS_KEY: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}"
                CLOUDFLARE_R2_BUCKET: "${CLOUDFLARE_R2_BUCKET:-}"
                CLOUDFLARE_R2_PUBLIC_URL: "${CLOUDFLARE_R2_PUBLIC_URL:-}"
                CLOUDFLARE_R2_UPLOAD_API_URL: "${CLOUDFLARE_R2_UPLOAD_API_URL:-}"
                CLOUDFLARE_R2_UPLOAD_API_TOKEN: "${CLOUDFLARE_R2_UPLOAD_API_TOKEN:-}"
                CLOUDFLARE_R2_KEY_PREFIX: "${CLOUDFLARE_R2_KEY_PREFIX:-douban-images}"
                CLOUDFLARE_R2_MAX_IMAGE_BYTES: "${CLOUDFLARE_R2_MAX_IMAGE_BYTES:-10485760}"
                R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
                R2_ENDPOINT: "${R2_ENDPOINT:-}"
                R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
                R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
                R2_BUCKET: "${R2_BUCKET:-}"
                R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
                REQUIRE_R2_IMAGE_SYNC: "true"
                KERKERKER_JOB_REPORT: ""
                KERKERKER_JOB_REPORT_URL: ""
                KERKERKER_JOB_REPORT_TOKEN: ""
                KERKERKER_JOB_ID: ""
          OVERRIDE

          project=(docker compose --env-file "$DEPLOY_ENV_FILE" -f "$compose_file" -f "$override_file")
          report_fragment="$DEPLOY_PATH/.job-report.env.new"
          env_backup=""
          merged_env=""
          preserve_env_backup=false
          cleanup() {
            rm -f "$override_file" "$report_fragment"
            if [ -n "$env_backup" ] && [ "$preserve_env_backup" != true ]; then
              rm -f "$env_backup"
            fi
            if [ -n "$merged_env" ]; then
              rm -f "$merged_env"
            fi
          }
          trap cleanup EXIT
          "${project[@]}" config --services | grep -Fxq douban-api || {
            echo "Compose project does not contain the douban-api service" >&2
            exit 1
          }

          stable_image="${STABLE_IMAGE_NAME}:latest"
          release_image="${IMAGE_NAME}:${IMAGE_TAG}"
          app_container_name="kerkerker-douban-service"
          legacy_backup=""
          merge_report_config() {
            [ -f "$report_fragment" ] || {
              echo "Staged refresh job-report configuration is missing" >&2
              return 1
            }
            chmod 600 "$report_fragment"
            env_directory="$(dirname "$DEPLOY_ENV_FILE")"
            report_backup_candidate="$(mktemp "$env_directory/.douban.env.backup.XXXXXX")"
            if ! cp -p "$DEPLOY_ENV_FILE" "$report_backup_candidate"; then
              rm -f "$report_backup_candidate"
              return 1
            fi
            if ! chmod 600 "$report_backup_candidate"; then
              rm -f "$report_backup_candidate"
              return 1
            fi
            env_backup="$report_backup_candidate"
            merged_env="$(mktemp "$env_directory/.douban.env.merged.XXXXXX")"
            awk '!/^(KERKERKER_JOB_REPORT|KERKERKER_JOB_REPORT_URL|KERKERKER_JOB_REPORT_TOKEN|KERKERKER_JOB_ID|KERKERKER_PLUGIN_ID|KERKERKER_PLUGIN_VERSION|KERKERKER_PLUGIN_PROFILE|KERKERKER_PLUGIN_CONFIG_VERSION|KERKERKER_JOB_ACTOR|TMDB_PLUGIN_SERVICE_TOKEN)=/' \
              "$DEPLOY_ENV_FILE" > "$merged_env"
            cat "$report_fragment" >> "$merged_env"
            chmod 600 "$merged_env"
            mv "$merged_env" "$DEPLOY_ENV_FILE"
            merged_env=""
          }
          restore_report_config() {
            if [ -n "$env_backup" ]; then
              if [ ! -f "$env_backup" ] || ! mv -f "$env_backup" "$DEPLOY_ENV_FILE"; then
                preserve_env_backup=true
                return 1
              fi
              env_backup=""
            fi
          }
          previous_image_id="$(docker image inspect "$stable_image" --format '{{.Id}}' 2>/dev/null || true)"
          if [ -z "$previous_image_id" ] && docker container inspect "$app_container_name" >/dev/null 2>&1; then
            previous_image_id="$(docker container inspect "$app_container_name" --format '{{.Image}}')"
          fi
          rollback() {
            echo "Deployment failed; restoring previous image" >&2
            if [ -n "$legacy_backup" ] && docker container inspect "$legacy_backup" >/dev/null 2>&1; then
              "${project[@]}" rm -sf douban-api || true
              docker rename "$legacy_backup" "$app_container_name" || true
              docker start "$app_container_name" || true
              return
            fi
            if [ -n "$previous_image_id" ]; then
              docker tag "$previous_image_id" "$stable_image"
              "${project[@]}" up -d --no-deps --no-build --force-recreate douban-api || true
              return
            fi
            "${project[@]}" rm -sf douban-api || true
          }
          deployment_succeeded=false
          rollout_started=false
          finish() {
            exit_status=$?
            trap - EXIT
            if [ "$deployment_succeeded" != true ]; then
              set +e
              if [ "$rollout_started" = true ]; then
                rollback
              fi
              if ! restore_report_config; then
                echo "Failed to restore the previous deployment environment; manual recovery is required" >&2
                exit_status=1
              fi
            fi
            cleanup
            exit "$exit_status"
          }
          trap finish EXIT

          merge_report_config
          docker pull "$release_image"
          docker tag "$release_image" "$stable_image"
          rollout_started=true

          # The existing production container predates Compose ownership. Keep it
          # intact until the first Compose-managed replacement passes smoke tests.
          if docker container inspect "$app_container_name" >/dev/null 2>&1; then
            compose_service="$(docker container inspect "$app_container_name" \
              --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            if [ "$compose_service" != "douban-api" ]; then
              backup_candidate="${app_container_name}-pre-compose-${IMAGE_TAG:0:12}"
              docker container inspect "$backup_candidate" >/dev/null 2>&1 && {
                echo "Legacy backup container already exists: $backup_candidate" >&2
                exit 1
              }
              docker stop "$app_container_name"
              if ! docker rename "$app_container_name" "$backup_candidate"; then
                docker start "$app_container_name" || true
                exit 1
              fi
              legacy_backup="$backup_candidate"
            fi
          fi

          "${project[@]}" up -d --no-deps --no-build --force-recreate douban-api

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${SERVICE_PORT}/health" >/dev/null; then
              break
            fi
            [ "$attempt" -eq 40 ] && { echo "Douban service health check failed" >&2; exit 1; }
            sleep 3
          done

          if docker container inspect "$app_container_name" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Eq '^KERKERKER_JOB_REPORT(_URL|_TOKEN)?=.'; then
            echo "Refresh job-report credentials leaked into the long-lived API container" >&2
            exit 1
          fi

          r2_public_url="$(docker exec "$app_container_name" sh -c \
            'printf %s "${CLOUDFLARE_R2_PUBLIC_URL:-$R2_PUBLIC_URL}"')"
          [ -n "$r2_public_url" ] || {
            echo "R2 public URL is not configured in the deployed container" >&2
            exit 1
          }
          while [ "${r2_public_url%/}" != "$r2_public_url" ]; do
            r2_public_url="${r2_public_url%/}"
          done

          status_response="$(curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${SERVICE_PORT}/api/v1/status")"
          printf '%s' "$status_response" | grep -Eq '"r2_image_sync_enabled"[[:space:]]*:[[:space:]]*true' || {
            echo "R2 image synchronization is not enabled" >&2
            exit 1
          }
          printf '%s' "$status_response" | grep -Eq '"r2_image_mapping_persistent"[[:space:]]*:[[:space:]]*true' || {
            echo "R2 image mapping persistence is not enabled" >&2
            exit 1
          }

          # The first request can start the asynchronous Top 250 image mirror.
          # Poll the cached result until every cover points at this deployment's
          # configured R2 public prefix. Never print the prefix or response body.
          synced_cover_count=0
          for attempt in $(seq 1 200); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              "http://127.0.0.1:${SERVICE_PORT}/api/v1/250")"
            printf '%s' "$response" | grep -Eq '"code"[[:space:]]*:[[:space:]]*200' || {
              echo "Top 250 smoke test did not return code 200" >&2
              exit 1
            }
            subject_count="$(printf '%s' "$response" | grep -o '"id":"[^"]*"' | wc -l | tr -d '[:space:]')"
            cover_values="$(printf '%s' "$response" | grep -o '"cover":"[^"]*"' | sed 's/^"cover":"//; s/"$//' || true)"
            cover_count="$(printf '%s\n' "$cover_values" | awk 'NF { count++ } END { print count + 0 }')"
            [ "$subject_count" -eq 250 ] && [ "$cover_count" -eq 250 ] || {
              echo "Top 250 smoke test returned $subject_count items and $cover_count covers" >&2
              exit 1
            }
            synced_cover_count="$(printf '%s\n' "$cover_values" | awk -v prefix="${r2_public_url}/" \
              'index($0, prefix) == 1 { count++ } END { print count + 0 }')"
            if [ "$synced_cover_count" -eq 250 ]; then
              break
            fi
            if [ "$attempt" -eq 1 ] || [ $((attempt % 12)) -eq 0 ]; then
              echo "Top 250 R2 image sync progress: ${synced_cover_count}/250"
            fi
            [ "$attempt" -lt 200 ] && sleep 5
          done
          [ "$synced_cover_count" -eq 250 ] || {
            echo "Top 250 R2 image sync timed out at ${synced_cover_count}/250" >&2
            exit 1
          }

          if [ -n "$legacy_backup" ]; then
            docker rm "$legacy_backup"
          fi
          deployment_succeeded=true
          echo "Douban service deployment healthy on port ${SERVICE_PORT}; R2 image sync is enabled and Top 250 covers are 250/250"
          REMOTE

      - name: Clean staged refresh credentials
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DEPLOY_PATH/.job-report.env.new'"

      - name: Deployment summary
        run: |
          echo "Deployed ${IMAGE_NAME}:${{ needs.publish.outputs.image_tag }} from ${GITHUB_REF_NAME}"
          echo "Server path: ${DEPLOY_PATH}"
          echo "Server port: ${SERVICE_PORT}"
